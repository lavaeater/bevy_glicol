[workspace]
members = ["tui_glicol",
    "bevy_glicol",
    "bevy_glicol_ui",
    "glicol/rs/main",
    "glicol/rs/synth",
    "glicol/rs/parser",
    "glicol/rs/macros"]
resolver = "1"

[workspace.package]
version = "0.13.5"
edition = "2024"
repository = "https://github.com/lavaeater/bevy_glicol"
authors = [
    "Tommie Nygren <tommie.nygren@gmail.com>",
    "Qichao Lan <chaosprint@gmail.com>",
]

[workspace.dependencies]
petgraph = { version = "0.8.3", features = ["stable_graph"] }
dasp_slice = { version = "0.11.0", default-features = false, features = [
    "std",
] }
dasp_ring_buffer = "0.11.0"
dasp_signal = "0.11.0"
dasp_interpolate = { version = "0.11.0", features = ["linear", "sinc"] }
hashbrown = "0.16.1"
arrayvec = "0.7.6"
rhai = { version = "1.23.6", default-features = false, features = [
    "sync",
    "f32_float",
    "only_i32",
] }
fasteval = "0.2.4"
pest = "2.8.4"
pest_derive = "2.8.4"
lcs-diff = "0.1.1"
